<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Requests — Tourstk Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">
  <style>
    .admin-nav{background:var(--color-surface);border-bottom:1px solid var(--color-border-light);padding:var(--space-2) 0;position:sticky;top:0;z-index:var(--z-sticky)}
    .admin-nav-inner{max-width:var(--container-max);margin:0 auto;padding:0 var(--margin-mobile);display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
    .admin-nav-links{display:flex;gap:var(--space-1);overflow-x:auto;padding-bottom:2px}
    .admin-nav-link{padding:var(--space-1) var(--space-3);border-radius:var(--radius-md);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--color-text-secondary);transition:all 0.15s;white-space:nowrap}
    .admin-nav-link:hover{background:var(--color-sand);color:var(--color-text)}
    .admin-nav-link.active{background:var(--color-primary-surface);color:var(--color-primary);font-weight:var(--weight-semibold)}
    .table-wrapper{overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch}
  </style>
</head>
<body>
  <nav class="admin-nav">
    <div class="admin-nav-inner">
      <a href="../index.html" class="navbar-logo">
        <div class="navbar-logo-icon" style="width:32px;height:32px;font-size:16px"><span class="material-symbols-outlined" style="font-size:18px">landscape</span></div>
        <div><span class="navbar-logo-text" style="font-size:var(--text-lg)">Tourstk</span><span class="navbar-logo-sub">Admin</span></div>
      </a>
      <div class="admin-nav-links">
        <a href="index.html" class="admin-nav-link">Dashboard</a>
        <a href="bookings.html" class="admin-nav-link">Bookings</a>
        <a href="packages.html" class="admin-nav-link">Packages</a>
        <a href="custom-requests.html" class="admin-nav-link active">Custom</a>
      </div>
      <a href="../index.html" class="btn btn-ghost btn-sm"><span class="material-symbols-outlined" style="font-size:16px">open_in_new</span> View Site</a>
    </div>
  </nav>

  <section class="section-sm">
    <div class="container">
      <h1 style="font-size:var(--text-2xl);margin-bottom:var(--space-6)">Custom Trip Requests</h1>
      <div class="table-wrapper" id="custom-table"></div>
    </div>
  </section>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="custom-modal">
    <div class="modal" style="max-width:560px">
      <div class="modal-header">
        <h3 style="font-family:var(--font-body);font-size:var(--text-lg)" id="cm-title">Request Details</h3>
        <button onclick="document.getElementById('custom-modal').classList.remove('open')"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body" id="cm-body"></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script>
    let customListCache = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!TourstkAPI.isAuthenticated()) {
        try { await TourstkAPI.loginAdmin('admin@tourstk.com', 'admin123456'); } catch (e) {}
      }
      renderCustomTable();
    });

    async function renderCustomTable() {
      let requests = [];
      try {
        const res = await TourstkAPI.getCustomRequests();
        if (res && res.success && res.data) {
          requests = res.data.map(r => ({
            _id: r._id,
            id: r.requestId,
            name: r.customerName,
            phone: r.phone,
            date: r.travelDate,
            people: r.groupSize,
            budget: r.estimatedBudget ? `৳${r.estimatedBudget.toLocaleString()}` : 'Flexible',
            duration: r.duration,
            special: r.specialRequests,
            status: (r.status || 'New').toLowerCase(),
          }));
        }
      } catch (err) {
        console.warn('API error, falling back to local custom requests', err);
      }

      if (!requests || requests.length === 0) {
        requests = CustomRequestManager.getAll().reverse();
      }

      customListCache = requests;
      const table = document.getElementById('custom-table');

      table.innerHTML = requests.length ? `
        <table class="admin-table">
          <thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Date</th><th>People</th><th>Budget</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            ${requests.map(r => `
              <tr>
                <td style="font-weight:var(--weight-semibold);color:var(--color-primary)">${r.id}</td>
                <td>${r.name}</td>
                <td style="font-size:var(--text-xs)">${r.phone}</td>
                <td style="font-size:var(--text-xs)">${r.date || 'Flexible'}</td>
                <td>${r.people || '-'}</td>
                <td style="font-size:var(--text-xs)">${r.budget || 'N/A'}</td>
                <td><span class="status-badge ${r.status}">${r.status.toUpperCase()}</span></td>
                <td>
                  <button class="btn btn-ghost btn-sm" onclick="openCustomDetail('${r.id}')">
                    <span class="material-symbols-outlined" style="font-size:16px">visibility</span>
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : '<p class="text-muted text-sm text-center" style="padding:var(--space-8)">No custom trip requests yet. These appear when customers submit the custom trip form on the Planner page.</p>';
    }

    function openCustomDetail(id) {
      const r = customListCache.find(x => x.id === id);
      if (!r) return;
      document.getElementById('cm-title').textContent = `Request: ${r.id}`;
      document.getElementById('cm-body').innerHTML = `
        <div style="display:grid;gap:var(--space-3)">
          <div class="flex justify-between text-sm"><span class="text-muted">Name</span><span class="font-semibold">${r.name}</span></div>
          <div class="flex justify-between text-sm"><span class="text-muted">Phone</span><span class="font-semibold">${r.phone}</span></div>
          <hr style="border:none;border-top:1px solid var(--color-border-light)">
          <div class="flex justify-between text-sm"><span class="text-muted">Travel Date</span><span>${r.date || 'Not specified'}</span></div>
          <div class="flex justify-between text-sm"><span class="text-muted">People</span><span>${r.people || '-'}</span></div>
          <div class="flex justify-between text-sm"><span class="text-muted">Budget</span><span>${r.budget || 'N/A'}</span></div>
          <div class="flex justify-between text-sm"><span class="text-muted">Duration</span><span>${r.duration || 'N/A'}</span></div>
          ${r.special ? `
            <hr style="border:none;border-top:1px solid var(--color-border-light)">
            <div><span class="text-sm text-muted">Special Requirements</span><p style="font-size:var(--text-sm);margin-top:var(--space-1)">${r.special}</p></div>
          ` : ''}
        </div>
        <div style="margin-top:var(--space-6)">
          <div class="form-group">
            <label class="form-label">Update Status</label>
            <select class="form-select" id="cust-status">
              <option value="new" ${r.status==='new'?'selected':''}>New</option>
              <option value="contacted" ${r.status==='contacted'?'selected':''}>Contacted</option>
              <option value="quoted" ${r.status==='quoted'?'selected':''}>Quoted</option>
              <option value="confirmed" ${r.status==='confirmed'?'selected':''}>Confirmed</option>
            </select>
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="updateCustomStatus('${r.id}')">Save Status</button>
        </div>
      `;
      document.getElementById('custom-modal').classList.add('open');
    }

    async function updateCustomStatus(id) {
      const r = customListCache.find(x => x.id === id);
      const newStatusVal = document.getElementById('cust-status').value;
      const capStatus = newStatusVal.charAt(0).toUpperCase() + newStatusVal.slice(1);

      try {
        if (r && r._id) {
          await TourstkAPI.updateCustomRequest(r._id, { status: capStatus });
        }
      } catch (err) {
        console.warn('API update failed, saving locally', err);
      }

      const requests = CustomRequestManager.getAll();
      const idx = requests.findIndex(x => x.id === id);
      if (idx !== -1) {
        requests[idx].status = newStatusVal;
        CustomRequestManager.save(requests);
      }

      document.getElementById('custom-modal').classList.remove('open');
      renderCustomTable();
    }

    document.getElementById('custom-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('custom-modal')) {
        document.getElementById('custom-modal').classList.remove('open');
      }
    });
  </script>
</body>
</html>
