<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bookings — Tourstk Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">
  <style>
    .admin-nav{background:var(--color-surface);border-bottom:1px solid var(--color-border-light);padding:var(--space-2) 0;position:sticky;top:0;z-index:var(--z-sticky)}
    .admin-nav-inner{max-width:var(--container-max);margin:0 auto;padding:0 var(--margin-mobile);display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
    .admin-nav-links{display:flex;gap:var(--space-1);overflow-x:auto;padding-bottom:2px}
    .admin-nav-link{padding:var(--space-1) var(--space-3);border-radius:var(--radius-md);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--color-text-secondary);transition:all 0.15s;white-space:nowrap}
    .admin-nav-link:hover{background:var(--color-sand);color:var(--color-text)}
    .admin-nav-link.active{background:var(--color-primary-surface);color:var(--color-primary);font-weight:var(--weight-semibold)}
    .table-wrapper{overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch}
  </style>
</head>
<body>
  <nav class="admin-nav">
    <div class="admin-nav-inner">
      <a href="../index.html" class="navbar-logo">
        <div class="navbar-logo-icon" style="width:32px;height:32px;font-size:16px"><span class="material-symbols-outlined" style="font-size:18px">landscape</span></div>
        <div><span class="navbar-logo-text" style="font-size:var(--text-lg)">Tourstk</span><span class="navbar-logo-sub">Admin</span></div>
      </a>
      <div class="admin-nav-links">
        <a href="index.html" class="admin-nav-link">Dashboard</a>
        <a href="bookings.html" class="admin-nav-link active">Bookings</a>
        <a href="packages.html" class="admin-nav-link">Packages</a>
        <a href="custom-requests.html" class="admin-nav-link">Custom</a>
      </div>
      <a href="../index.html" class="btn btn-ghost btn-sm"><span class="material-symbols-outlined" style="font-size:16px">open_in_new</span> View Site</a>
    </div>
  </nav>

  <section class="section-sm">
    <div class="container">
      <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
        <h1 style="font-size:var(--text-2xl)">Booking Management</h1>
        <div class="flex gap-3">
          <select class="form-select" style="width:auto;min-width:140px" id="filter-status" onchange="renderBookingsTable()">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="review">Under Review</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <button class="btn btn-accent btn-sm" onclick="BookingManager.downloadExcel();showToast('Exported!')">
            <span class="material-symbols-outlined" style="font-size:16px">download</span> Export
          </button>
        </div>
      </div>

      <div class="table-wrapper" id="bookings-table"></div>
    </div>
  </section>

  <!-- Booking Detail Modal -->
  <div class="modal-overlay" id="booking-modal">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <h3 style="font-family:var(--font-body);font-size:var(--text-lg)" id="modal-title">Booking Details</h3>
        <button onclick="closeModal()"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script>
    function showToast(msg) {
      let c = document.querySelector('.toast-container');
      if (!c) { c = document.createElement('div'); c.className = 'toast-container'; document.body.appendChild(c); }
      const t = document.createElement('div'); t.className = 'toast';
      t.innerHTML = `<span class="material-symbols-outlined" style="font-size:18px">check_circle</span> ${msg}`;
      c.appendChild(t);
      setTimeout(() => { t.style.opacity='0'; t.style.transform='translateY(12px)'; t.style.transition='all 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
    }

    let liveBookingsCache = [];

    async function ensureAuth() {
      if (typeof TourstkAPI !== 'undefined' && !TourstkAPI.isAuthenticated()) {
        try {
          await TourstkAPI.loginAdmin('admin@tourstk.com', 'admin123456');
        } catch (e) {}
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await ensureAuth();
      await fetchAndRenderBookings();
    });

    async function fetchAndRenderBookings() {
      let bookings = [];
      if (typeof TourstkAPI !== 'undefined') {
        try {
          const res = await TourstkAPI.getBookings({ limit: 100 });
          if (res?.success && Array.isArray(res.data)) {
            bookings = res.data.map(b => ({
              id: b.bookingId || b._id,
              _id: b._id,
              name: b.customerName,
              phone: b.phone,
              email: b.email,
              packageName: b.packageName,
              travelDate: b.travelDate,
              travelers: b.guests?.total || b.guests?.adults || 1,
              totalPrice: b.pricing?.grandTotal || 0,
              status: (b.status || 'pending').toLowerCase(),
              paymentStatus: b.payment?.paymentStatus || 'Pending Verification',
              trxId: b.payment?.trxId || '',
              paidAmount: b.payment?.paidAmount || 0,
              specialRequests: b.specialRequests || '',
            }));
          }
        } catch (e) {
          console.warn('API error in bookings table, fallback to local', e);
        }
      }

      const localBookings = (typeof BookingManager !== 'undefined') ? BookingManager.getAll() : [];
      const mergedMap = new Map();
      bookings.forEach(b => {
        const id = b.id || b.bookingId || b._id;
        if (id) mergedMap.set(String(id).toUpperCase(), b);
      });
      localBookings.forEach(b => {
        const id = b.id || b.bookingId || b._id;
        if (id && !mergedMap.has(String(id).toUpperCase())) {
          mergedMap.set(String(id).toUpperCase(), {
            id: b.id || id,
            _id: b._id || id,
            name: b.name || b.customerName,
            phone: b.phone,
            email: b.email,
            packageName: b.packageName,
            travelDate: b.travelDate,
            travelers: b.travelers || b.guests?.total || 1,
            totalPrice: b.totalPrice || b.pricing?.grandTotal || 0,
            status: (b.status || 'pending').toLowerCase(),
            paymentStatus: b.paymentStatus || 'Pending Verification',
            trxId: b.trxId || '',
            paidAmount: b.paidAmount || 0,
            specialRequests: b.specialRequests || '',
          });
        }
      });

      bookings = Array.from(mergedMap.values());
      liveBookingsCache = bookings;
      renderBookingsTable();
    }

    function renderBookingsTable() {
      let bookings = [...liveBookingsCache];
      const filter = document.getElementById('filter-status').value;
      if (filter !== 'all') bookings = bookings.filter(b => b.status === filter);
      bookings.reverse();

      const table = document.getElementById('bookings-table');
      table.innerHTML = bookings.length ? `
        <table class="admin-table">
          <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Package</th><th>Date</th><th>Travelers</th><th>Price</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            ${bookings.map(b => `
              <tr>
                <td style="font-weight:var(--weight-semibold);color:var(--color-primary)">${b.id}</td>
                <td>${b.name}</td>
                <td style="font-size:var(--text-xs)">${b.phone}</td>
                <td style="font-size:var(--text-xs)">${b.packageName || 'N/A'}</td>
                <td style="font-size:var(--text-xs)">${b.travelDate || 'N/A'}</td>
                <td>${b.travelers || '-'}</td>
                <td style="font-weight:var(--weight-semibold)">৳${(b.totalPrice||0).toLocaleString()}</td>
                <td><span class="status-badge ${b.status}">${b.status}</span></td>
                <td>
                  <button class="btn btn-ghost btn-sm" onclick="openBookingDetail('${b.id}')">
                    <span class="material-symbols-outlined" style="font-size:16px">visibility</span>
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : '<p class="text-muted text-sm text-center" style="padding:var(--space-8)">No bookings found.</p>';
    }

    function openBookingDetail(id) {
      const b = BookingManager.getAll().find(x => x.id === id);
      if (!b) return;
      document.getElementById('modal-title').textContent = `Booking: ${b.id}`;
      document.getElementById('modal-body').innerHTML = `
        <div style="display:grid;gap:var(--space-3);margin-bottom:var(--space-6)">
          <div class="flex justify-between text-sm"><span class="text-muted">Name</span><span class="font-semibold">${b.name}</span></div>
          <div class="flex justify-between text-sm"><span class="text-muted">Phone</span><span class="font-semibold">${b.phone}</span></div>
          ${b.email ? `<div class="flex justify-between text-sm"><span class="text-muted">Email</span><span>${b.email}</span></div>` : ''}
          ${b.address ? `<div class="flex justify-between text-sm"><span class="text-muted">Address</span><span>${b.address}</span></div>` : ''}
          <hr style="border:none;border-top:1px solid var(--color-border-light)">
          <div class="flex justify-between text-sm"><span class="text-muted">Package</span><span class="font-semibold">${b.packageName || 'N/A'}</span></div>
          <div class="flex justify-between text-sm"><span class="text-muted">Travel Date</span><span>${b.travelDate || 'N/A'}</span></div>
          <div class="flex justify-between text-sm"><span class="text-muted">Travelers</span><span>${b.travelers || '-'}</span></div>
          ${b.roomPreference && b.roomPreference.roomType ? `<div class="flex justify-between text-sm"><span class="text-muted">Room & Bed</span><span class="font-semibold text-primary">${b.roomPreference.roomType} (${b.roomPreference.bedType || '1 Queen Bed'}, ${b.roomPreference.roomCount || 1} Room)</span></div>` : ''}
          ${b.pickup ? `<div class="flex justify-between text-sm"><span class="text-muted">Pickup</span><span>${b.pickup}</span></div>` : ''}
          ${b.special ? `<div class="flex justify-between text-sm"><span class="text-muted">Special</span><span>${b.special}</span></div>` : ''}
          <div class="flex justify-between text-sm font-bold"><span>Total Price</span><span class="text-primary">৳${(b.totalPrice||0).toLocaleString()}</span></div>
        </div>
        <div class="form-group">
          <label class="form-label">Update Status</label>
          <select class="form-select" id="update-status">
            <option value="pending" ${b.status==='pending'?'selected':''}>Pending</option>
            <option value="review" ${b.status==='review'?'selected':''}>Under Review</option>
            <option value="confirmed" ${b.status==='confirmed'?'selected':''}>Confirmed</option>
            <option value="completed" ${b.status==='completed'?'selected':''}>Completed</option>
            <option value="cancelled" ${b.status==='cancelled'?'selected':''}>Cancelled</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Admin Notes</label>
          <textarea class="form-textarea" id="update-notes" style="min-height:80px" placeholder="Coordination details, provider contacts, notes...">${b.adminNotes || ''}</textarea>
        </div>
        <div class="flex gap-3">
          <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="updateBooking('${b.id}')">
            <span class="material-symbols-outlined" style="font-size:16px">save</span> Save Changes
          </button>
          <button class="btn btn-ghost" style="color:var(--color-error)" onclick="deleteBooking('${b.id}')">
            <span class="material-symbols-outlined" style="font-size:16px">delete</span>
          </button>
        </div>
      `;
      document.getElementById('booking-modal').classList.add('open');
    }

    function updateBooking(id) {
      const status = document.getElementById('update-status').value;
      const notes = document.getElementById('update-notes').value;
      BookingManager.updateStatus(id, status, notes);
      closeModal();
      renderBookingsTable();
      showToast('Booking updated!');
    }

    function deleteBooking(id) {
      if (confirm('Delete this booking permanently?')) {
        BookingManager.delete(id);
        closeModal();
        renderBookingsTable();
        showToast('Booking deleted');
      }
    }

    function closeModal() {
      document.getElementById('booking-modal').classList.remove('open');
    }

    document.getElementById('booking-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('booking-modal')) closeModal();
    });
  </script>
</body>
</html>
