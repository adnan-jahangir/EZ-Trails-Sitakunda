  <script>
    // Distance Helper (Haversine Formula in km)
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return (R * c).toFixed(1);
    }

    function renderDestinationDetails() {
      // Load custom photos from localStorage
      try {
        const customSpots = JSON.parse(localStorage.getItem('tourstk_custom_spots') || '{}');

          const s = (window.TOURSTK?.destinations || []).find(d => d.id === id || d.destinationId === id);
          if (s && Array.isArray(customSpots[id])) {
            s.gallery = customSpots[id];
          }
        });
      } catch (e) {}

      const params = new URLSearchParams(window.location.search);
      const destId = params.get('id') || 'chandranath-hill';
      const allDests = (window.TOURSTK?.destinations || []);
      const dest = allDests.find(d => d.id === destId || d.destinationId === destId) || allDests[0];

      if (!dest) return;

      const allPkgs = (window.TOURSTK?.packages || []);
      // Matching packages for this spot
      const matchingPkgs = allPkgs.filter(p => (p.destinations || p.spots || []).includes(dest.id) || (p.destinations || p.spots || []).includes(dest.destinationId));

      // Calculate distance to all other destinations
      const nearbySpots = allDests
        .filter(d => d.id !== dest.id)
        .map(d => {
          const dist = (dest.lat && dest.lng && d.lat && d.lng) 
            ? parseFloat(getDistanceKm(dest.lat, dest.lng, d.lat, d.lng)) 
            : 5.0;
          return { ...d, distance: dist };
        })
        .sort((a, b) => a.distance - b.distance);

      const activeGallery = (dest.gallery && dest.gallery.length > 0) ? dest.gallery : [
        { type: 'image', src: dest.image, thumb: dest.image, label: 'Main View' }

            </div>
            <h1 class="font-display text-4xl sm:text-5xl font-bold text-primary mb-3">${dest.name}</h1>
            <p class="text-base text-slate-600 max-w-3xl leading-relaxed">${dest.shortDesc}</p>
          </div>

          <!-- Live Sitakunda Weather & Trail Advisory -->
          <div id="dest-weather-advisory" class="mb-8"></div>

          <!-- INTERACTIVE GALLERY & 4K CINEMA STAGE -->

            <!-- Main Display Screen with Ambient Backdrop & Crisp Hero Stage -->
            <div class="rounded-3xl overflow-hidden shadow-2xl border border-slate-200/90 relative group bg-slate-950 aspect-[16/10] sm:aspect-[16/9] md:h-[480px] w-full flex items-center justify-center p-3 sm:p-4 transition-all" id="dest-main-media-box">
              
              <!-- Ambient Blurred Backdrop (Vibrant color-matched atmospheric glow) -->
              <div id="dest-hero-ambient-blur" class="absolute inset-0 bg-cover bg-center blur-3xl opacity-80 scale-125 brightness-90 pointer-events-none transition-all duration-700" style="background-image: url('${initialMedia.thumb || initialMedia.src}');"></div>
              
              <!-- Frosted Glass Vignette Overlay (Soft depth) -->
              <div class="absolute inset-0 bg-slate-950/30 backdrop-blur-[2px] pointer-events-none z-0"></div>

              <!-- Top Right Controls (Fit / Fill Toggle & Fullscreen Lightbox) -->

                <button type="button" onclick="toggleHeroFitMode()" id="hero-fit-toggle-btn" class="bg-black/60 hover:bg-black/85 backdrop-blur-md text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-md flex items-center gap-1.5 border border-white/20 transition-all cursor-pointer" title="Toggle between Sharp View & Fill Screen">

              <div>
                <h3 class="font-display text-xl font-bold text-primary mb-3">Things to Do & Experience</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${((Array.isArray(dest.thingsToDo) && dest.thingsToDo.length > 0) ? dest.thingsToDo : ['বুনো ট্রেইলে ট্রেকিং ও ক্যাম্পিং', 'প্রাকৃতিক সৌন্দর্য উপভোগ ও ফটোগ্রাফি']).map(t => `
                    <div class="bg-slate-50 text-slate-700 border border-slate-200/80 p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2">
                      <span class="material-symbols-outlined text-emerald-600 text-base flex-shrink-0">check_circle</span>
                      <span>${t}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Tips & Recommendations -->
              <div>
                <h3 class="font-display text-xl font-bold text-primary mb-3">Local Tips & Travel Advice</h3>
                <div class="space-y-2.5">
                  ${((Array.isArray(dest.tips) && dest.tips.length > 0) ? dest.tips : ['পর্যাপ্ত বিশুদ্ধ খাবার পানি সাথে রাখুন', 'গ্রিপিং ট্র্যাকিং জুতো পরিধান করুন']).map(tip => `
                    <div class="p-3.5 rounded-xl bg-amber-50/70 border border-amber-200/60 text-xs text-amber-950 flex items-start gap-2.5">
                      <span class="material-symbols-outlined text-amber-700 text-base mt-0.5">tips_and_updates</span>
                      <span class="leading-relaxed">${tip}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Sidebar Packages -->
            <div>
              <div class="sticky top-28 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-700 block mb-1">Guided Tour</span>
                <h3 class="font-bold text-lg text-primary mb-2">Want to Visit ${dest.name}?</h3>
                <p class="text-xs text-slate-500 mb-6 leading-relaxed">Book a complete package with dedicated AC vehicle, vetted guide, and entry tickets included.</p>

                <div class="space-y-3 mb-6">
                  ${matchingPkgs.length > 0 ? matchingPkgs.map(p => `
                    <a href="/package-detail?id=${p.id}" class="p-3.5 bg-slate-50 rounded-2xl border border-slate-100 block hover:border-emerald-500 transition-all group">
                      <div class="text-xs font-bold text-primary group-hover:text-emerald-700 transition-colors">${p.name}</div>
                      <div class="text-xs text-emerald-700 font-extrabold mt-1">৳${p.price.toLocaleString()} / person</div>
                    </a>
                  `).join('') : `
                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 text-xs text-slate-500">
                      You can customize a trip to this spot via our Trip Planner!
                    </div>
                  `}
                </div>

                <a href="/planner" class="w-full bg-primary hover:bg-primary-dark text-white text-center font-bold py-3.5 rounded-full block text-xs shadow-xs transition-all">
                  Plan Custom Trip Here
                </a>
              </div>
            </div>
          </div>

          <!-- ============================================================= -->
          <!-- INTERACTIVE MAP & NEARBY SPOTS SECTION (Requested by user) -->
          <!-- ============================================================= -->
          <div class="pt-12 border-t border-slate-200" id="nearby-map-section">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-8 gap-4">
              <div>
                <span class="text-xs font-bold uppercase tracking-widest text-emerald-700 block mb-2">Interactive Location Map</span>
                <h2 class="font-display text-3xl font-bold text-primary">Spot Location & Nearby Attractions</h2>
                <p class="text-slate-500 text-sm mt-1">
                  Explore <span class="font-bold text-slate-700">${dest.name}</span> on the map and discover all nearby spots in Sitakunda.
                </p>
              </div>

              <!-- Map Legend -->
              <div class="flex items-center gap-3 text-xs font-semibold">
                <span class="inline-flex items-center gap-1.5 bg-emerald-100 text-emerald-900 px-3 py-1 rounded-full border border-emerald-300">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-600 animate-pulse"></span>
                  Current Location
                </span>
                <span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-700 px-3 py-1 rounded-full border border-slate-200">
                  <span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                  Nearby Spots
                </span>
              </div>
            </div>

            <!-- Interactive Map Container -->
            <div class="rounded-2xl sm:rounded-3xl overflow-hidden border border-slate-200/90 shadow-xl relative h-[320px] sm:h-[420px] md:h-[480px] mb-8 group">
              <!-- Live Leaflet Map Container -->
              <div id="dest-map" class="w-full h-full"></div>
            </div>

            <!-- Nearby Spots Grid -->
            <div>
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-display text-lg sm:text-xl font-bold text-slate-900">Closest Destinations Around ${dest.name}</h3>
                <span class="text-[11px] font-semibold text-slate-500 hidden sm:inline">Top 4 nearest spots</span>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-6">
                ${nearbySpots.slice(0, 4).map(spot => `
                  <div class="spot-card bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-2xs hover:shadow-md transition-all flex flex-col group">
                    <div class="relative h-24 sm:h-36 bg-slate-100 overflow-hidden">
                      <img src="${spot.image}" alt="${spot.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                      <span class="absolute top-2 left-2 bg-white/90 backdrop-blur-xs text-primary font-bold text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full shadow-xs">
                        ${spot.category}
                      </span>
                      <span class="absolute bottom-2 right-2 bg-slate-900/85 backdrop-blur-xs text-white font-bold text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full">
                        ~${spot.distance} km
                      </span>
                    </div>
                    <div class="p-3 sm:p-4 flex flex-col flex-grow justify-between">
                      <div>
                        <div class="text-[9px] sm:text-[10px] font-bold text-emerald-800 mb-0.5">${spot.bnName}</div>
                        <h4 class="font-bold text-xs sm:text-sm text-slate-900 group-hover:text-primary transition-colors line-clamp-1">${spot.name}</h4>
                        <p class="text-[10px] sm:text-[11px] text-slate-500 line-clamp-1 sm:line-clamp-2 mt-0.5">${spot.shortDesc}</p>
                      </div>
                      <div class="pt-2 mt-2 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-[9px] sm:text-[10px] text-slate-400 truncate">${spot.category}</span>
                        <a href="/destination-detail?id=${spot.id}" class="text-[11px] sm:text-xs font-bold text-primary hover:underline flex items-center gap-0.5 flex-shrink-0">
                          <span>View</span>
                          <span class="material-symbols-outlined text-xs">arrow_forward</span>
                        </a>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

          </div>
        </div>
      `;

      // =============================================================
      // INITIALIZE LEAFLET MAP & PIN ALL SPOT IMAGES
      // =============================================================
      setTimeout(() => {
        const mapContainer = document.getElementById('dest-map');
        if (!mapContainer || typeof L === 'undefined') return;

        const currentLat = dest.lat || 22.6189;
        const currentLng = dest.lng || 91.6811;

        // Initialize Map
        const isMobile = window.innerWidth < 640;
        const map = L.map('dest-map', {
          center: [currentLat, currentLng],
          zoom: isMobile ? 11 : 12,
          scrollWheelZoom: false
        });
        window.activeDestMap = map;
        window.activeDestCenter = [currentLat, currentLng];

        // Clean, High-Resolution OpenStreetMap Street View (100% Free - Zero API Key Needed!)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
          maxZoom: 19
        }).addTo(map);

        // Add Floating Bottom-Left Directions & Recenter Control
        const navControl = L.control({ position: 'bottomleft' });
        navControl.onAdd = function() {
          const div = L.DomUtil.create('div', 'leaflet-nav-control-box');
          L.DomEvent.disableClickPropagation(div);
          L.DomEvent.disableScrollPropagation(div);
          div.innerHTML = `
            <div class="hidden sm:flex items-center gap-2 select-none mb-1">
              <a href="${dest.mapUrl || `https://www.google.com/maps/dir/?api=1&destination=${currentLat},${currentLng}`}" target="_blank" class="bg-white/95 hover:bg-white text-slate-800 text-[11px] font-bold px-3.5 py-2 rounded-xl shadow-md border border-slate-200 flex items-center gap-1.5 hover:text-primary transition-all">
                <span class="material-symbols-outlined text-sm text-emerald-600">directions</span>
                <span>Google Maps Directions</span>
              </a>
              <button type="button" onclick="recenterMap()" class="bg-white/95 hover:bg-white text-slate-800 text-[11px] font-bold px-3 py-2 rounded-xl shadow-md border border-slate-200 flex items-center gap-1.5 hover:text-primary transition-all cursor-pointer" title="Recenter on this spot">
                <span class="material-symbols-outlined text-sm text-primary">my_location</span>
                <span>Recenter</span>
              </button>
            </div>
          `;
          return div;
        };
        navControl.addTo(map);

        // Pin each of the 14 destinations on the Map
        TOURSTK.destinations.forEach(spot => {
          if (!spot.lat || !spot.lng) return;

          const isCurrent = spot.id === dest.id;
          const distText = isCurrent ? 'Current Location' : `~${getDistanceKm(currentLat, currentLng, spot.lat, spot.lng)} km away`;

          // Custom HTML Pin with Spot Image
          const pinHtml = `
            <div class="custom-spot-pin ${isCurrent ? 'active-spot' : ''}">
              ${isCurrent ? `<span class="pin-badge">📍 Here</span>` : ''}
              <div class="pin-img-wrapper">
                <img src="${spot.image}" alt="${spot.name}" style="width:100%;height:100%;object-fit:cover;">
              </div>
              <div class="pin-pointer"></div>
            </div>
          `;

          const pinW = isCurrent ? (isMobile ? 42 : 52) : (isMobile ? 34 : 44);
          const pinH = isCurrent ? (isMobile ? 46 : 58) : (isMobile ? 38 : 50);

          const customIcon = L.divIcon({
            html: pinHtml,
            className: 'custom-leaflet-div-icon',
            iconSize: [pinW, pinH],
            iconAnchor: [pinW / 2, pinH],
            popupAnchor: [0, -pinH]
          });

          // Popup Card Content (Mobile Sized & Crisp)
          const popupContent = `
            <div style="width: 190px; font-family: 'Plus Jakarta Sans', sans-serif;">
              <div style="height: 85px; position: relative; overflow: hidden;">
                <img src="${spot.image}" style="width:100%; height:100%; object-fit:cover;">
                <span style="position:absolute; top:6px; left:6px; background:rgba(255,255,255,0.92); font-size:9px; font-weight:800; padding:1px 6px; border-radius:99px; color:#0e4d34;">
                  ${spot.category}
                </span>
              </div>
              <div style="padding: 10px;">
                <div style="font-size:9px; font-weight:bold; color:#059669;">${spot.bnName}</div>
                <h4 style="font-size:12px; font-weight:bold; margin:2px 0; color:#0f172a; line-height:1.2;">${spot.name}</h4>
                <div style="font-size:10px; color:#64748b; margin-bottom:6px;">${distText}</div>
                <a href="/destination-detail?id=${spot.id}" style="display:block; text-align:center; background:#0e4d34; color:#fff; font-size:10px; font-weight:bold; padding:5px 0; border-radius:99px; text-decoration:none;">
                  Explore Spot →
                </a>
              </div>
            </div>
          `;

          const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(map);
          marker.bindPopup(popupContent);

          // If current destination, open popup by default
          if (isCurrent && !isMobile) {
            marker.openPopup();
          }
        });

      // Store gallery globally for switcher
      window.currentDestGallery = dest.gallery || [
        { type: 'image', src: dest.image, thumb: dest.image, label: 'Main View' },
        { type: 'image', src: dest.fallbackImage || dest.image, thumb: dest.fallbackImage || dest.image, label: 'Scenic View' },
        { type: 'image', src: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80', thumb: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=300&q=80', label: 'Valley' },
        { type: 'video', src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', thumb: dest.image, label: '4K Video' }
      ];

      }, 100);

      if (window.TourstkAnimations) {
        setTimeout(window.TourstkAnimations.refresh, 40);
      }
    }

    window.addEventListener('tourstk:destinations-updated', renderDestinationDetails);
    window.addEventListener('tourstk:packages-updated', renderDestinationDetails);

    document.addEventListener('DOMContentLoaded', async () => {
      renderDestinationDetails();
      if (window.TourstkAPI) {
        await Promise.all([
          TourstkAPI.fetchAndSyncDestinations(),
          TourstkAPI.fetchAndSyncPackages()
        ]);
        renderDestinationDetails();
      }
    });

    function switchDetailHeroMedia(itemIndex) {
      if (!window.currentDestGallery || !window.currentDestGallery[itemIndex]) return;
      const item = window.currentDestGallery[itemIndex];
      const mainImg = document.getElementById('dest-hero-main-img');
      const mainVideo = document.getElementById('dest-hero-main-video');
      const videoSrc = document.getElementById('dest-hero-video-src');

      // Update ambient backdrop
      const ambient = document.getElementById('dest-hero-ambient-blur');
      if (ambient) {
        ambient.style.backgroundImage = `url('${item.thumb || item.src}')`;
      }

      // Update active border on thumbnails
      document.querySelectorAll('.dest-thumb-btn').forEach((btn, idx) => {
        if (idx === itemIndex) {
          btn.className = btn.className.replace(/border-transparent|opacity-75/g, '') + ' border-primary ring-2 ring-emerald-400/50 opacity-100';
        } else {
          btn.className = btn.className.replace(/border-primary|ring-2 ring-emerald-400\/50/g, '') + ' border-transparent opacity-75';
        }
      });

      if (item.type === 'video') {
        if (mainImg) mainImg.classList.add('hidden');
        if (mainVideo && videoSrc) {
          videoSrc.src = item.src;
          mainVideo.load();
          mainVideo.classList.remove('hidden');
          mainVideo.play().catch(() => {});
        }
      } else {
        if (mainVideo) {
          mainVideo.pause();
          mainVideo.classList.add('hidden');
        }
        if (mainImg) {
          mainImg.src = item.src;
          mainImg.classList.remove('hidden');
        }
      }
    }

    let heroFitMode = 'fit'; // 'fit' (100% native clarity, no pixelation) or 'fill' (edge-to-edge)

    function toggleHeroFitMode() {
      const img = document.getElementById('dest-hero-main-img');
      const ambient = document.getElementById('dest-hero-ambient-blur');
      const icon = document.getElementById('hero-fit-icon');
      const text = document.getElementById('hero-fit-text');
      if (!img) return;

      if (heroFitMode === 'fit') {
        heroFitMode = 'fill';
        img.className = 'absolute inset-0 w-full h-full object-cover transition-all duration-500 cursor-pointer';
        if (ambient) ambient.className = 'absolute inset-0 bg-cover bg-center blur-2xl opacity-50 scale-110 pointer-events-none transition-all duration-700';
        if (icon) icon.textContent = 'fit_screen';
        if (text) text.textContent = 'Sharp View';
      } else {
        heroFitMode = 'fit';
        img.className = 'relative z-10 max-h-[350px] sm:max-h-[440px] w-auto max-w-[95%] object-contain rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.6)] border border-white/15 transition-all duration-500 cursor-pointer hover:scale-[1.01]';
        img.style.imageRendering = '-webkit-optimize-contrast';
        if (ambient) ambient.className = 'absolute inset-0 bg-cover bg-center blur-3xl opacity-80 scale-125 brightness-90 pointer-events-none transition-all duration-700';
        if (icon) icon.textContent = 'crop_free';
        if (text) text.textContent = 'Fill Screen';
      }
    }

    function openHeroLightbox() {
      const mainImg = document.getElementById('dest-hero-main-img');
      if (!mainImg || !mainImg.src) return;
      
      let lightbox = document.getElementById('dest-hero-lightbox');
      if (!lightbox) {
        lightbox = document.createElement('div');
        lightbox.id = 'dest-hero-lightbox';
        lightbox.className = 'fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex items-center justify-center p-4 transition-all animate-in fade-in duration-200';
        lightbox.onclick = (e) => {
          if (e.target === lightbox || e.target.closest('#lightbox-close-btn')) {
            lightbox.classList.add('hidden');
          }
        };
        lightbox.innerHTML = `
          <button type="button" id="lightbox-close-btn" class="absolute top-5 right-5 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors cursor-pointer z-50 shadow-lg">
            <span class="material-symbols-outlined text-2xl">close</span>
          </button>
          <img id="dest-lightbox-img" src="${mainImg.src}" class="max-w-[95vw] max-h-[90vh] object-contain rounded-2xl shadow-2xl" alt="Preview">
        `;
        document.body.appendChild(lightbox);
      } else {
        const lbImg = document.getElementById('dest-lightbox-img');
        if (lbImg) lbImg.src = mainImg.src;
        lightbox.classList.remove('hidden');
      }
    }

    window.recenterMap = function() {
      if (!window.activeDestMap || !window.activeDestCenter) return;
      window.activeDestMap.setView(window.activeDestCenter, window.innerWidth < 640 ? 12 : 13, { animate: true });
    };
  </script>
</body>
</html>
