    // Distance Helper (Haversine Formula in km)
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return (R * c).toFixed(1);
    }

        .map(d => {
          const dist = (dest.lat && dest.lng && d.lat && d.lng) 
            ? parseFloat(getDistanceKm(dest.lat, dest.lng, d.lat, d.lng))

                <span class="text-[11px] font-semibold text-slate-500 hidden sm:inline">Top 4 nearest spots</span>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-6">
                ${nearbySpots.slice(0, 4).map(spot => `
                  <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-2xs hover:shadow-md transition-all flex flex-col group">
                    <div class="relative h-24 sm:h-36 bg-slate-100 overflow-hidden">
                      <img src="${spot.image}" alt="${spot.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                      <span class="absolute top-2 left-2 bg-white/90 backdrop-blur-xs text-primary font-bold text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full shadow-xs">
                        ${spot.category}
                      </span>
                      <span class="absolute bottom-2 right-2 bg-slate-900/85 backdrop-blur-xs text-white font-bold text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full">
                        ~${spot.distance} km
                      </span>
                    </div>
                    <div class="p-3 sm:p-4 flex flex-col flex-grow justify-between">
                      <div>
                        <div class="text-[9px] sm:text-[10px] font-bold text-emerald-800 mb-0.5">${spot.bnName}</div>
                        <h4 class="font-bold text-xs sm:text-sm text-slate-900 group-hover:text-primary transition-colors line-clamp-1">${spot.name}</h4>
                        <p class="text-[10px] sm:text-[11px] text-slate-500 line-clamp-1 sm:line-clamp-2 mt-0.5">${spot.shortDesc}</p>
                      </div>
                      <div class="pt-2 mt-2 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-[9px] sm:text-[10px] text-slate-400 truncate">${spot.category}</span>
                        <a href="destination-detail.html?id=${spot.id}" class="text-[11px] sm:text-xs font-bold text-primary hover:underline flex items-center gap-0.5 flex-shrink-0">
                          <span>View</span>
                          <span class="material-symbols-outlined text-xs">arrow_forward</span>
                        </a>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

          </div>
        </div>
      `;

      // =============================================================
      // INITIALIZE LEAFLET MAP & PIN ALL SPOT IMAGES
      // =============================================================
      setTimeout(() => {
        const mapContainer = document.getElementById('dest-map');
        if (!mapContainer || typeof L === 'undefined') return;

        const currentLat = dest.lat || 22.6189;
        const currentLng = dest.lng || 91.6811;

        // Initialize Map
        const isMobile = window.innerWidth < 640;
        const map = L.map('dest-map', {
          center: [currentLat, currentLng],
          zoom: isMobile ? 11 : 12,
          scrollWheelZoom: false
        });

        // CartoDB Voyager Clean High-Resolution Map Tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          subdomains: 'abcd',
          maxZoom: 19
        }).addTo(map);

        // Pin each of the 12 destinations on the Map
        TOURSTK.destinations.forEach(spot => {
          if (!spot.lat || !spot.lng) return;

          const isCurrent = spot.id === dest.id;
          const distText = isCurrent ? 'Current Location' : `~${getDistanceKm(currentLat, currentLng, spot.lat, spot.lng)} km away`;

          // Custom HTML Pin with Spot Image
          const pinHtml = `
            <div class="custom-spot-pin ${isCurrent ? 'active-spot' : ''}">
              ${isCurrent ? `<span class="pin-badge">📍 Here</span>` : ''}
              <div class="pin-img-wrapper">
                <img src="${spot.image}" alt="${spot.name}" style="width:100%;height:100%;object-fit:cover;">
              </div>
              <div class="pin-pointer"></div>
            </div>
          `;

          const pinW = isCurrent ? (isMobile ? 42 : 52) : (isMobile ? 34 : 44);
          const pinH = isCurrent ? (isMobile ? 46 : 58) : (isMobile ? 38 : 50);

          const customIcon = L.divIcon({
            html: pinHtml,
            className: 'custom-leaflet-div-icon',
            iconSize: [pinW, pinH],
            iconAnchor: [pinW / 2, pinH],
            popupAnchor: [0, -pinH]
          });

          // Popup Card Content (Mobile Sized & Crisp)
          const popupContent = `
            <div style="width: 190px; font-family: 'Plus Jakarta Sans', sans-serif;">
              <div style="height: 85px; position: relative; overflow: hidden;">
                <img src="${spot.image}" style="width:100%; height:100%; object-fit:cover;">
                <span style="position:absolute; top:6px; left:6px; background:rgba(255,255,255,0.92); font-size:9px; font-weight:800; padding:1px 6px; border-radius:99px; color:#0e4d34;">
                  ${spot.category}
                </span>
              </div>
              <div style="padding: 10px;">
                <div style="font-size:9px; font-weight:bold; color:#059669;">${spot.bnName}</div>
                <h4 style="font-size:12px; font-weight:bold; margin:2px 0; color:#0f172a; line-height:1.2;">${spot.name}</h4>
                <div style="font-size:10px; color:#64748b; margin-bottom:6px;">${distText}</div>
                <a href="destination-detail.html?id=${spot.id}" style="display:block; text-align:center; background:#0e4d34; color:#fff; font-size:10px; font-weight:bold; padding:5px 0; border-radius:99px; text-decoration:none;">
                  Explore Spot →
                </a>
              </div>
            </div>
          `;

          const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(map);
          marker.bindPopup(popupContent);

          // If current destination, open popup by default
          if (isCurrent && !isMobile) {
            marker.openPopup();
          }
        });

      // Store gallery globally for switcher
      window.currentDestGallery = dest.gallery || [
        { type: 'image', src: dest.image, thumb: dest.image, label: 'Main View' },
        { type: 'image', src: dest.fallbackImage || dest.image, thumb: dest.fallbackImage || dest.image, label: 'Scenic View' },
        { type: 'image', src: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80', thumb: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=300&q=80', label: 'Valley' },
        { type: 'video', src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', thumb: dest.image, label: '4K Video' }
      ];

      }, 100);
    });

    function switchDetailHeroMedia(itemIndex) {
      if (!window.currentDestGallery || !window.currentDestGallery[itemIndex]) return;
      const item = window.currentDestGallery[itemIndex];
      const mainImg = document.getElementById('dest-hero-main-img');
      const mainVideo = document.getElementById('dest-hero-main-video');
      const videoSrc = document.getElementById('dest-hero-video-src');

      // Update active border on thumbnails
      document.querySelectorAll('.dest-thumb-btn').forEach((btn, idx) => {
        if (idx === itemIndex) {
          btn.className = btn.className.replace(/border-transparent|opacity-75/g, '') + ' border-primary ring-2 ring-emerald-400/50 opacity-100';
        } else {
          btn.className = btn.className.replace(/border-primary|ring-2 ring-emerald-400\/50/g, '') + ' border-transparent opacity-75';
        }
      });

      if (item.type === 'video') {
        if (mainImg) mainImg.classList.add('hidden');
        if (mainVideo && videoSrc) {
          videoSrc.src = item.src;
          mainVideo.load();
          mainVideo.classList.remove('hidden');
          mainVideo.play().catch(() => {});
        }
      } else {
        if (mainVideo) {
          mainVideo.pause();
          mainVideo.classList.add('hidden');
        }
        if (mainImg) {
          mainImg.src = item.src;
          mainImg.classList.remove('hidden');
        }
      }
    }
  </script>
</body>
</html>
